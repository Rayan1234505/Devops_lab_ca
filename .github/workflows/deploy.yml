name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image:
        description: "Immutable image reference (repo@sha256:...)"
        required: true
        type: string
      version:
        description: "Expected APP_VERSION reported by /healthz"
        required: true
        type: string

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
      url: https://${{ vars.APP_DOMAIN }}
    env:
      TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DOMAIN: ${{ vars.APP_DOMAIN }}
      SSH_OPTS: -o StrictHostKeyChecking=yes -o BatchMode=yes
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy deployment files
        run: |
          ssh $SSH_OPTS "$TARGET" "mkdir -p '$DEPLOY_PATH'"
          scp $SSH_OPTS deploy/docker-compose.yml deploy/Caddyfile deploy/deploy.sh "$TARGET:$DEPLOY_PATH/"

      - name: Registry login on host
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh $SSH_OPTS "$TARGET" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Deploy (with automatic rollback)
        run: |
          ssh $SSH_OPTS "$TARGET" "cd '$DEPLOY_PATH' && IMAGE='${{ inputs.image }}' DOMAIN='$DOMAIN' bash deploy.sh"

      - name: Post-deploy smoke test
        run: |
          for i in $(seq 1 15); do
            body=$(curl -fsS "https://${DOMAIN}/healthz" || true)
            echo "$body" | grep -q '"status":"ok"' && ok=1 && break
            sleep 4
          done
          [ "${ok:-0}" = 1 ] || { echo "Version check failed: $body"; exit 1; }
          curl -fsS "https://${DOMAIN}/" | grep -q "QR Code Generator"
          ct=$(curl -fsS -o /dev/null -w '%{content_type}' -X POST -d "data=smoke" "https://${DOMAIN}/download")
          [ "$ct" = "image/png" ]
